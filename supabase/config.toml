# Supabase CLI configuration for Marketifyall Design Editor
# See: https://supabase.com/docs/guides/cli/config

[project]
id = "your-project-ref"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]

[auth.external.google]
enabled = false

[auth.external.github]
enabled = false
